function computeMatrix(){
const selectedGrades=[...state.grades].sort();
if(!selectedGrades.length)return{xLabels:[],matrix:[]};
const filtered=STUDENTS.filter(s=>state.grades.has(SECTION_GRADE[s[0]]));

if(state.group==="section"){const secIdxs=SECTIONS.map((_,i)=>i).filter(i=>state.grades.has(SECTION_GRADE[i]));const xLabels=secIdxs.map(i=>SECTIONS[i]);const matrix=secIdxs.map(()=>[0,0,0,0,0]);filtered.forEach(s=>{const si=secIdxs.indexOf(s[0]);if(si>=0)matrix[si][bandOf(s[11])]++});return{xLabels,matrix}}
const xLabels=SUBJECTS.slice();const matrix=SUBJECTS.map(()=>[0,0,0,0,0]);filtered.forEach(s=>{for(let j=0;j<11;j++){matrix[j][bandOf(s[1+j])]++}});return{xLabels,matrix}}
const ctx=document.getElementById("mainChart").getContext("2d");let chart=null;
